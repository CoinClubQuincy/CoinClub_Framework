[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coinclub"
version = "1.0.0"
description = "One Python interface for payments, liquidity and gateways across XRP, Stellar, XDC, Flare, Filecoin, Algorand, Cardano and EOS."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "R Quincy Jones" }]
keywords = ["blockchain", "xrpl", "stellar", "xdc", "flare", "filecoin", "algorand", "cardano", "eos", "payments"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
]
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
xrpl = ["xrpl-py>=5,<6"]
stellar = ["stellar-sdk>=13,<18"]
evm = ["web3>=7,<9"]
algorand = ["py-algorand-sdk>=2.12,<3"]
cardano = ["pycardano>=0.12,<1", "blockfrost-python>=0.6", "cbor2<6"]
aws = ["boto3>=1.34"]
all = ["coinclub[xrpl,stellar,evm,algorand,cardano,aws]"]
dev = [
  "coinclub[all]",
  "pytest>=8",
  "pytest-cov>=5",
  "responses>=0.25",
  "moto[dynamodb,secretsmanager,ssm]>=5",
  "eth-tester[py-evm]>=0.12.0b1",
  "ruff>=0.6",
]

[project.scripts]
coinclub = "coinclub.cli:main"

[project.urls]
Repository = "https://github.com/CoinClubQuincy/CoinClub_Framework"

[tool.hatch.build.targets.wheel]
packages = ["src/coinclub"]

[tool.hatch.build.targets.sdist]
exclude = ["legacy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: talks to a public test network; run with -m live"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
