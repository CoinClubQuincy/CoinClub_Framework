# Real transactions on public test networks, using faucets and throwaway wallets.
# Weekly rather than per pull request, because those networks and faucets can go down.
name: live

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - run: pytest -m live -o addopts=""
